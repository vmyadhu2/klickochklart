<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Klick och Klart account password." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e3b43" />
  <title>Klick och Klart | Reset Password</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-page-shell">
    <section class="connect-card reset-page-card">
      <a class="brand" href="index.html#connect" aria-label="Klick och Klart home">
        <img class="brand-icon" src="icon.svg" alt="" width="40" height="40" />
        <span>Klick och Klart</span>
      </a>

      <div class="reset-heading page-reset-heading">
        <strong>Reset password</strong>
        <span id="reset-instructions">Enter your email and request a 4-character reset code.</span>
      </div>

      <form id="request-reset-form" class="auth-form">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <button class="button button-primary" type="submit">Send reset code</button>
      </form>

      <form id="confirm-reset-form" class="auth-form" hidden>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required readonly />
        </label>
        <label>
          4-character code
          <input type="text" name="code" autocomplete="one-time-code" minlength="4" maxlength="4" required />
        </label>
        <label>
          New password
          <input type="password" name="new_password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          Verify new password
          <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required />
        </label>
        <p class="auth-help">Minimum 8 characters, with at least 1 capital letter, 1 number, and 1 special character. Old passwords cannot be reused.</p>
        <button class="button button-primary" type="submit">Change password</button>
      </form>

      <a class="text-button" href="index.html#connect">Back to sign in</a>
      <p id="reset-status" class="auth-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    window.KOK_API_BASE = "https://klickochklart-backend.onrender.com";
  </script>
  <script src="reset-password.js?v=2"></script>
</body>
</html>
