<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Try a Klick och Klart Fortnox invoice automation demo." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e3b43" />
  <title>Klick och Klart | Fortnox Demo</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-page-shell demo-page-shell">
    <section class="connect-card demo-page-card">
      <a class="brand" href="index.html#connect" aria-label="Klick och Klart home">
        <img class="brand-icon" src="icon.svg" alt="" width="40" height="40" />
        <span>Klick och Klart</span>
      </a>

      <div class="reset-heading page-reset-heading">
        <strong>Fortnox invoice demo</strong>
        <span>Connect Fortnox, read up to 50 invoices, and generate a CSV file.</span>
      </div>

      <div class="demo-actions">
        <button id="demo-connect-button" class="button button-primary" type="button" hidden>Connect Fortnox</button>
        <button id="demo-start-button" class="button button-primary" type="button" hidden>Start demo</button>
        <a id="demo-download-link" class="button button-secondary" download hidden>Download CSV</a>
      </div>

      <ol id="demo-log" class="demo-log" aria-live="polite"></ol>

      <a class="text-button" href="index.html#connect">Back to Klick och Klart</a>
      <p id="demo-status" class="auth-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    window.KOK_API_BASE = "https://klickochklart-backend.onrender.com";
  </script>
  <script src="fortnox-demo.js?v=1"></script>
</body>
</html>
